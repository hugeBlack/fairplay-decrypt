name: Build credential-retrieval

on:
  push:
    paths:
      - "credential-retrieval/**"
      - ".github/workflows/credential-retrieval.yml"
  pull_request:
    paths:
      - "credential-retrieval/**"
      - ".github/workflows/credential-retrieval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      THEOS: ${{ github.workspace }}/.ci/theos
      IOS_SDK_VERSION: "16.5"

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out Theos and supplemental headers
        uses: actions/checkout@v6
        with:
          repository: theos/theos
          ref: 6e7b8c40e0f5f9f5b2377800dc1e42cd2560d24a
          path: .ci/theos
          submodules: true
          persist-credentials: false

      - name: Check out iPhoneOS SDK
        uses: actions/checkout@v6
        with:
          repository: theos/sdks
          ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
          path: .ci/theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          persist-credentials: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtinfo6 libxml2 xz-utils

      # This is the non-Swift Linux toolchain used by Theos's official installer.
      - name: Install iOS cross toolchain
        run: |
          curl --fail --location --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz \
            --output "$RUNNER_TEMP/ios-toolchain.tar.xz"
          echo "a72a7a577e2fbe2838b6b5e9c72034fa7d114af96f0e1d4b016f18730ce4056e  $RUNNER_TEMP/ios-toolchain.tar.xz" | sha256sum --check
          mkdir -p "$THEOS/toolchain"
          tar -xJf "$RUNNER_TEMP/ios-toolchain.tar.xz" -C "$THEOS/toolchain"
          echo "$THEOS/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Check toolchain and SDK
        run: |
          clang --version
          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"
          test -f "$THEOS/vendor/include/IOKit/IOKitLib.h"
          test -d "$THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk"

      - name: Build and sign iOS arm64 programs
        run: |
          toolchain_bin="$THEOS/toolchain/linux/iphone/bin"
          make -C credential-retrieval \
            IOS_CC="$toolchain_bin/clang" \
            IOS_TARGET_FLAGS="-target arm64-apple-ios10.0 -isysroot $THEOS/sdks/iPhoneOS${IOS_SDK_VERSION}.sdk" \
            IOS_CPPFLAGS="-I$THEOS/vendor/include" \
            IOS_LDFLAGS="-fuse-ld=$toolchain_bin/ld" \
            LDID="$toolchain_bin/ldid"

      - name: Verify bundle and entitlements
        run: |
          for program in credential driver trigger; do
            ldid -e "credential-retrieval/build/bundle/$program.ios" > "$RUNNER_TEMP/$program.plist"
          done
          python3 - <<'PY'
          import os
          import plistlib
          import struct
          from pathlib import Path

          root = Path("credential-retrieval")
          bundle = root / "build/bundle"
          for program in ("credential", "driver", "trigger"):
              binary = bundle / f"{program}.ios"
              magic, cpu, subtype, kind = struct.unpack("<4I", binary.read_bytes()[:16])
              assert (magic, cpu, kind) == (0xFEEDFACF, 0x0100000C, 2), binary
              actual = plistlib.loads((Path(os.environ["RUNNER_TEMP"]) / f"{program}.plist").read_bytes())
              expected = plistlib.loads((root / program / f"{program}.entitlements.plist").read_bytes())
              assert actual == expected, f"Entitlements differ: {program}"
          for name in ("static-key-table.bin", "core4-word-table.bin"):
              data = (bundle / name).read_bytes()
              assert data and data == (root / "credential" / name).read_bytes(), name
          print("Verified arm64 Mach-O executables, entitlements and data tables.")
          PY

      # Keep executable permissions and the directory structure expected by retrieve.py.
      - name: Package retriever
        run: |
          tar -czf credential-retrieval-ios-arm64.tar.gz \
            LICENSE \
            credential-retrieval/README.md \
            credential-retrieval/retrieve.py \
            credential-retrieval/native_ssh.py \
            credential-retrieval/build/bundle

      - name: Upload compiled bundle
        uses: actions/upload-artifact@v4
        with:
          name: credential-retrieval-ios-arm64
          path: credential-retrieval-ios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
